version: "3.8"

services:
  # L-3 FIX: local dev PostgreSQL; set DATABASE_URL=postgresql://barbershop:changeme@db:5432/barbershop
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: barbershop
      POSTGRES_USER: barbershop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - barbershop_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U barbershop"]
      interval: 10s
      timeout: 5s
      retries: 5

  bot:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - barbershop_data:/app/data
      - barbershop_backups:/app/backups
    # H-2 FIX + P0 FIX: real liveness probe — verify bot process is alive AND DB exists,
    # instead of just one weak signal. Catches mid-init crashes.
    healthcheck:
      test:
        - "CMD-SHELL"
        - "pgrep -f 'python bot.py' > /dev/null && python -c 'import os, sys; db=os.getenv(\"DB_PATH\",\"/app/data/barbershop.db\"); sys.exit(0 if os.path.exists(db) else 1)'"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  barbershop_data:
  barbershop_backups:
  barbershop_pgdata:
